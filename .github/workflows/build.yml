name: Build VidGrab IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg make xz uv

      # ---------- Theos ----------
      - name: Install Theos manually
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          # 新版 Theos 的 sdks 目录可能已存在，先清空再克隆
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      # ---------- Python.xcframework（固定 3.14 分支）----------
      - name: Download Python.xcframework (3.14)
        run: |
          PY_TAG="3.14-b14"
          curl -L -o python-ios.tar.gz \
            "https://github.com/beeware/Python-Apple-support/releases/download/${PY_TAG}/Python.xcframework-${PY_TAG}.tar.gz" || \
          curl -L -o python-ios.tar.gz \
            "https://github.com/beeware/Python-Apple-support/releases/download/${PY_TAG}/Python-3.14-iOS-support.b14.tar.gz"
          tar -xzf python-ios.tar.gz
          XC_SRC=$(find . -maxdepth 3 -name "Python.xcframework" -type d | head -n 1)
          if [ -z "$XC_SRC" ]; then
            echo "未找到 Python.xcframework，请检查 BeeWare release 资产名称"
            exit 1
          fi
          sudo mkdir -p /root/pyios
          sudo cp -R "$XC_SRC" /root/pyios/Python.xcframework
          sudo chown -R $(id -u):$(id -g) /root/pyios
          ls /root/pyios/Python.xcframework

      # ---------- FFmpeg 静态库（full-gpl，含 lame）----------
      - name: Download FFmpeg iOS static libs (full-gpl)
        run: |
          FF_TAG="6.0"
          FF_URL="https://github.com/arthenica/ffmpeg-kit/releases/download/v${FF_TAG}.LTS/ffmpeg-kit-full-gpl-${FF_TAG}-ios-xcframework.zip"
          curl -L -o ffmpeg-ios.zip "$FF_URL"
          unzip -q ffmpeg-ios.zip -d ffmpeg-ios-extracted
          SLICE_DIR=$(find ffmpeg-ios-extracted -type d -name "ios-arm64" | head -n 1)
          if [ -z "$SLICE_DIR" ]; then
            echo "未找到 ios-arm64 切片，请检查 ffmpeg-kit zip 结构"
            exit 1
          fi
          sudo mkdir -p /root/ffmpeg-ios
          sudo cp -R "$SLICE_DIR/Headers" /root/ffmpeg-ios/include 2>/dev/null || \
            sudo cp -R "$SLICE_DIR/include" /root/ffmpeg-ios/include
          sudo cp -R "$SLICE_DIR/lib" /root/ffmpeg-ios/lib 2>/dev/null || \
            sudo mkdir -p /root/ffmpeg-ios/lib && sudo find "$SLICE_DIR" -name "*.a" -exec cp {} /root/ffmpeg-ios/lib/ \;
          sudo chown -R $(id -u):$(id -g) /root/ffmpeg-ios
          ls /root/ffmpeg-ios/include | head
          ls /root/ffmpeg-ios/lib | head

      # ---------- app_packages ----------
      - name: Prepare app_packages
        run: |
          sudo mkdir -p /root/app_packages
          sudo chown -R $(id -u):$(id -g) /root/app_packages

      # ---------- 修复 assemble.py 中硬编码的 Linux ldid 路径 ----------
      - name: Link ldid to expected path
        run: |
          sudo mkdir -p /root/theos/toolchain/linux/iphone/bin
          sudo ln -sf $(which ldid) /root/theos/toolchain/linux/iphone/bin/ldid

      # ---------- 构建 ----------
      - name: Build app
        run: make FINALPACKAGE=1

      - name: Assemble IPA
        run: python3 assemble.py

      - name: Locate IPA
        id: locate
        run: |
          IPA_PATH=$(find . -maxdepth 2 -name "VidGrab.ipa" -type f | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "未找到 VidGrab.ipa，请检查 assemble.py 输出"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "找到 IPA: $IPA_PATH"

      - name: Prepare output
        run: python3 assemble_ci.py "${{ steps.locate.outputs.IPA_PATH }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-IPA
          path: output/*.ipa
          if-no-files-found: error

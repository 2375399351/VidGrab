name: Build VidGrab IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg make xz uv

      # ---------- Theos ----------
      - name: Install Theos manually
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      # ---------- 将源码中硬编码的 /root 路径替换为 $HOME ----------
      - name: Patch hardcoded /root paths
        run: |
          sed -i '' "s#/root#$HOME#g" Makefile
          sed -i '' "s#/root#$HOME#g" assemble.py

      # ---------- 诊断并修复 VGConvert 头文件 ----------
      - name: Diagnose and repair VGConvert header
        run: |
          echo "=== Sources 下所有 .h 文件 ==="
          ls -la Sources/*.h 2>/dev/null || echo "(无 .h 文件)"

          echo ""
          echo "=== Sources/vgconvert.h ==="
          if [ -f Sources/vgconvert.h ]; then
            echo "大小: $(wc -c < Sources/vgconvert.h) 字节"
            echo "行数: $(wc -l < Sources/vgconvert.h)"
            echo "--- 前 30 行 ---"
            head -30 Sources/vgconvert.h
          else
            echo "文件不存在"
          fi

          echo ""
          echo "=== Sources/VGConvert.h（精确大小写）==="
          if [ -f Sources/VGConvert.h ]; then
            echo "大小: $(wc -c < Sources/VGConvert.h) 字节"
            echo "行数: $(wc -l < Sources/VGConvert.h)"
            echo "--- 前 30 行 ---"
            head -30 Sources/VGConvert.h
          else
            echo "文件不存在"
          fi

          echo ""
          echo "=== VGConvert.m 前 10 行 ==="
          head -10 Sources/VGConvert.m

          echo ""
          echo "=== 查找包含 @interface VGConvert 的文件 ==="
          grep -rl "@interface VGConvert" Sources/ 2>/dev/null || echo "未找到"

          echo ""
          echo "=== 修复逻辑 ==="
          VALID=0
          for f in Sources/vgconvert.h Sources/VGConvert.h; do
            if [ -f "$f" ] && [ -s "$f" ] && grep -q "@interface VGConvert" "$f"; then
              VALID=1
              echo "$f 内容有效"
              # 确保文件名是 VGConvert.h（匹配 .m 中的 import）
              if [ "$f" = "Sources/vgconvert.h" ] && [ ! -f Sources/VGConvert.h ]; then
                cp "$f" Sources/VGConvert.h
                echo "已复制 Sources/vgconvert.h -> Sources/VGConvert.h"
              fi
              break
            fi
          done

          if [ "$VALID" -eq 0 ]; then
            echo "本地头文件无效，尝试从上游 iamjhe08/VidGrab 下载..."
            for path in "Sources/VGConvert.h" "Sources/vgconvert.h"; do
              url="https://raw.githubusercontent.com/iamjhe08/VidGrab/main/$path"
              echo "尝试: $url"
              if curl -L --fail --silent -o /tmp/upstream.h "$url" 2>/dev/null; then
                if [ -s /tmp/upstream.h ] && grep -q "@interface VGConvert" /tmp/upstream.h; then
                  cp /tmp/upstream.h Sources/VGConvert.h
                  echo "成功从 $url 恢复 VGConvert.h"
                  VALID=1
                  break
                else
                  echo "下载的文件无效（为空或缺少 @interface VGConvert）"
                fi
              fi
            done
          fi

          if [ "$VALID" -eq 0 ]; then
            echo "错误：无法获得有效的 VGConvert.h，请手动检查仓库中的该文件"
            exit 1
          fi

          echo "VGConvert.h 已就绪"

      # ---------- Python.xcframework（锁定 3.14-b10）----------
      - name: Download Python.xcframework (3.14-b10)
        run: |
          PY_URL="https://github.com/beeware/Python-Apple-support/releases/download/3.14-b10/Python-3.14-iOS-support.b10.tar.gz"
          curl -L --fail -o python-ios.tar.gz "$PY_URL"
          tar -xzf python-ios.tar.gz
          XC_SRC=$(find . -maxdepth 3 -name "Python.xcframework" -type d | head -n 1)
          if [ -z "$XC_SRC" ]; then
            echo "未找到 Python.xcframework"
            exit 1
          fi
          mkdir -p $HOME/pyios
          cp -R "$XC_SRC" $HOME/pyios/Python.xcframework
          ls $HOME/pyios/Python.xcframework

      # ---------- FFmpeg（社区维护的 luthviar 镜像，含 libmp3lame）----------
      - name: Download FFmpeg iOS libs (community full-gpl mirror)
        run: |
          FF_URL="https://github.com/luthviar/ffmpeg-kit-ios-full/releases/download/6.0/ffmpeg-kit-ios-full.zip"
          curl -L --fail -o ffmpeg-ios.zip "$FF_URL"
          unzip -q ffmpeg-ios.zip -d ffmpeg-ios-extracted

          mkdir -p $HOME/ffmpeg-ios/include $HOME/ffmpeg-ios/lib

          found_mp3lame=0
          while IFS= read -r -d '' xcf; do
            slice="$xcf/ios-arm64"
            [ -d "$slice" ] || continue

            if [ -d "$slice/Headers" ]; then
              cp -R "$slice/Headers/." $HOME/ffmpeg-ios/include/
            elif find "$slice" -maxdepth 2 -name Headers -type d | head -n 1 | grep -q .; then
              HDR_DIR=$(find "$slice" -maxdepth 2 -name Headers -type d | head -n 1)
              cp -R "$HDR_DIR/." $HOME/ffmpeg-ios/include/
            fi

            find "$slice" -maxdepth 2 -name "*.a" -exec cp {} $HOME/ffmpeg-ios/lib/ \;
            for fw in "$slice"/*.framework; do
              [ -d "$fw" ] || continue
              bin="$fw/$(basename "$fw" .framework)"
              [ -f "$bin" ] && cp "$bin" $HOME/ffmpeg-ios/lib/
            done

            [ -f "$slice/libmp3lame.a" ] || find "$slice" -name "*mp3lame*" -exec cp {} $HOME/ffmpeg-ios/lib/ \; 2>/dev/null
            [ -f "$HOME/ffmpeg-ios/lib/libmp3lame.a" ] && found_mp3lame=1
          done < <(find ffmpeg-ios-extracted -name "*.xcframework" -type d -print0)

          if [ "$found_mp3lame" -ne 1 ]; then
            echo "警告：未找到 libmp3lame.a，Makefile 链接时可能失败"
          fi

          echo "--- include 文件数 ---"
          ls $HOME/ffmpeg-ios/include | wc -l
          echo "--- lib 文件列表 ---"
          ls $HOME/ffmpeg-ios/lib

      # ---------- app_packages ----------
      - name: Prepare app_packages
        run: |
          mkdir -p $HOME/app_packages

      # ---------- 修复 assemble.py 中硬编码的 ldid 路径 ----------
      - name: Link ldid to expected path
        run: |
          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          ln -sf $(which ldid) $HOME/theos/toolchain/linux/iphone/bin/ldid

      # ---------- 构建（兜底抑制大小写警告）----------
      - name: Build app
        run: make FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error=nonportable-include-path"

      - name: Assemble IPA
        run: python3 assemble.py

      - name: Locate IPA
        id: locate
        run: |
          IPA_PATH=$(find . -maxdepth 2 -name "VidGrab.ipa" -type f | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "未找到 VidGrab.ipa"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "找到 IPA: $IPA_PATH"

      - name: Prepare output
        run: python3 assemble_ci.py "${{ steps.locate.outputs.IPA_PATH }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-IPA
          path: output/*.ipa
          if-no-files-found: error
